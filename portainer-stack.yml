# GateLab 1.0.0 — deploy published image from GitHub Container Registry.
# This preserves the original exposed host port 8088.
services:
  gatelab:
    image: ghcr.io/shields10-cal/gate-lab:latest
    pull_policy: always
    container_name: gatelab
    restart: unless-stopped
    ports:
      - "8088:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
