# Local build + deployment using: docker compose up -d --build
services:
  gatelab:
    build:
      context: .
      dockerfile: Dockerfile
    image: gatelab:1.0.0
    container_name: gatelab
    restart: unless-stopped
    ports:
      - "8088:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
